<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analista de Ações Nimbus 3.000 Avançado com Gemini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .container-card {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .input-group, .button-group {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }
        #results {
            white-space: pre-wrap;
            min-height: 150px;
            transition: all 0.3s ease;
        }
        .loading-animation {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid #10b981;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Estilos específicos para cards de preço na análise técnica */
        .price-card {
            background-color: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            flex-grow: 1;
            text-align: center;
        }
    </style>
</head>
<body class="p-4">

    <div class="container-card bg-white shadow-xl rounded-2xl p-6 md:p-10 border border-gray-100">

        <h1 class="text-3xl font-extrabold text-gray-800 mb-2"> Analista de Ações Nimbus 3.000🚀</h1>
        <p class="text-gray-500 mb-6">Insira o ticker (símbolo) de uma ação ou ativo (ex: GOOG, PETR4.SA) e escolha o tipo de análise.</p>

        <!-- Seção de Entrada -->
        <div class="input-group mb-6 flex-col sm:flex-row">
            <input type="text" id="tickerInput" placeholder="Ex: GOOG ou PETR4.SA"
                   class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 transition duration-150 shadow-sm">
            <button id="clearButton" onclick="clearResults()"
                    class="w-full sm:w-auto px-6 py-3 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 transition duration-150 shadow-md">
                Limpar
            </button>
        </div>

        <!-- Seção de Botões de Análise -->
        <div class="button-group flex-wrap justify-center sm:justify-start mb-8">
            <button onclick="analyzeStock('fundamental')"
                    class="flex items-center justify-center px-4 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition duration-150 shadow-lg transform hover:scale-[1.02] active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-indigo-500 min-w-[150px] m-1">
                Análise Fundamentalista
            </button>

            <button onclick="analyzeStock('technical')"
                    class="flex items-center justify-center px-4 py-3 bg-emerald-600 text-white font-semibold rounded-xl hover:bg-emerald-700 transition duration-150 shadow-lg transform hover:scale-[1.02] active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-emerald-500 min-w-[150px] m-1">
                Análise Técnica
            </button>

            <button onclick="analyzeStock('momentum')"
                    class="flex items-center justify-center px-4 py-3 bg-amber-600 text-white font-semibold rounded-xl hover:bg-amber-700 transition duration-150 shadow-lg transform hover:scale-[1.02] active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-amber-500 min-w-[150px] m-1">
                Análise de Momentum
            </button>
        </div>

        <!-- Seção de Resultados -->
        <div class="bg-gray-50 p-6 rounded-xl border border-gray-200 shadow-inner">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center">
                <span id="analysisTitle" class="truncate">Resultados da Análise</span>
            </h2>
            <div id="results" class="text-gray-700 leading-relaxed min-h-[100px]">
                Aguardando o ticker e o tipo de análise...
            </div>
            <div id="sourcesContainer" class="mt-4 text-sm text-gray-500"></div>
        </div>

        <!-- Seção de Mensagens/Erros (Para substituir alert()) -->
        <div id="messageBox" class="fixed bottom-4 right-4 p-4 rounded-lg shadow-xl hidden transition-opacity duration-300" role="alert"></div>

    </div>

    <script>
        // Variáveis Globais do Canvas (MANDATÓRIAS)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const apiKey = ""; // Deixamos vazio para o Canvas injetar a chave.
        const modelName = 'gemini-2.5-flash-preview-09-2025';

        // --- Funções de Utilitário ---

        // Função para mostrar mensagens temporárias (substitui alert())
        function showMessage(message, type = 'info') {
            const box = document.getElementById('messageBox');
            box.textContent = message;
            box.className = 'fixed bottom-4 right-4 p-4 rounded-lg shadow-xl transition-opacity duration-300 opacity-0';
            
            let bgColor = 'bg-blue-100 border-blue-400 text-blue-700';
            if (type === 'error') bgColor = 'bg-red-100 border-red-400 text-red-700';
            if (type === 'success') bgColor = 'bg-green-100 border-green-400 text-green-700';
            
            // Adiciona classes para o estilo e mostra a caixa
            setTimeout(() => {
                box.className = `fixed bottom-4 right-4 p-4 rounded-lg shadow-xl transition-opacity duration-300 opacity-100 border ${bgColor}`;
            }, 50);

            // Esconde após 5 segundos
            setTimeout(() => {
                box.className = box.className.replace('opacity-100', 'opacity-0');
                setTimeout(() => { box.classList.add('hidden'); }, 300); // Esconde totalmente após a transição
            }, 5000);
        }

        // Função para limpar os resultados
        function clearResults() {
            document.getElementById('tickerInput').value = '';
            document.getElementById('results').innerHTML = 'Aguardando o ticker e o tipo de análise...';
            document.getElementById('analysisTitle').textContent = 'Resultados da Análise';
            document.getElementById('sourcesContainer').innerHTML = '';
        }

        // --- Lógica Principal da Análise com Gemini API ---

        // Configuração de prompts e instruções específicas para cada análise
        function getAnalysisConfig(analysisType, ticker) {
            let systemPrompt = "";
            let userQuery = "";
            let title = "";

            switch (analysisType) {
                case 'fundamental':
                    title = "Análise Fundamentalista - " + ticker;
                    systemPrompt = "Você é um analista fundamentalista de ações. Use o Google Search para encontrar dados financeiros e indicadores chave. Forneça uma análise concisa, mas completa, sobre a saúde financeira, valuation, e perspectivas futuras do ativo. O resultado deve ser formatado em Markdown com títulos e listas, mas sem bullet points externos.";
                    userQuery = `Forneça a análise fundamentalista mais recente para a ação/ativo: ${ticker}. Use apenas informações de fontes fidedignas e recentes.`;
                    break;
                case 'technical':
                    title = "Análise Técnica Completa - " + ticker;
                    // Instrução para atender ao requisito de "cards com preços importantes"
                    systemPrompt = "Você é um analista técnico de mercado de ações de elite. Use o Google Search para encontrar dados de preço e indicadores recentes. Forneça uma análise técnica COMPLETA e bem estruturada para o ativo solicitado. Comece o seu resumo listando 3-4 'PREÇOS CHAVE' (como Suporte, Resistência, e Preço Atual) formatados em negrito, simulando cards. Em seguida, forneça uma análise detalhada sobre indicadores como Médias Móveis (MM), RSI e Volume. Use o formato Markdown.";
                    userQuery = `Realize a análise técnica e de preços chaves para a ação/ativo: ${ticker}.`;
                    break;
                case 'momentum':
                    title = "Análise de Momentum - " + ticker;
                    // Instrução focada no momentum
                    systemPrompt = "Você é um especialista em estratégias de momentum. Use o Google Search para encontrar tendências de preço de curto prazo. Forneça uma análise focada exclusivamente no momentum da ação/ativo, indicando se o momento é forte (alta), fraco (baixa) ou neutro. Indique os principais fatores que influenciam o momentum (como volume recente, mudanças de preço de curto prazo). Use uma linguagem decisiva (Exemplo: Forte Alta). Use o formato Markdown.";
                    userQuery = `Realize a análise de momentum para a ação/ativo: ${ticker}.`;
                    break;
                default:
                    throw new Error("Tipo de análise desconhecido.");
            }

            return { systemPrompt, userQuery, title };
        }

        // Função para fazer o fetch com backoff (para lidar com limites de taxa)
        async function fetchWithBackoff(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.status !== 429) { // 429 Too Many Requests
                        return response;
                    }
                    // Se for 429, espera e tenta novamente
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    console.warn(`[API] Limite de taxa atingido. Tentando novamente em ${Math.round(delay / 1000)}s.`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                } catch (error) {
                    console.error("[API] Erro durante o fetch, tentando novamente:", error);
                    if (i === maxRetries - 1) throw error; // Re-lança se for a última tentativa
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
            throw new Error("Falha na chamada da API após várias tentativas de backoff.");
        }


        // Função principal que chama o Gemini API
        async function analyzeStock(analysisType) {
            const tickerInput = document.getElementById('tickerInput');
            const ticker = tickerInput.value.trim().toUpperCase();
            const resultsDiv = document.getElementById('results');
            const sourcesDiv = document.getElementById('sourcesContainer');
            const titleElement = document.getElementById('analysisTitle');

            if (!ticker) {
                showMessage("Por favor, insira um ticker de ação (ex: GOOG).", 'error');
                return;
            }

            // Exibir estado de carregamento
            titleElement.innerHTML = `<span class="loading-animation"></span> Gerando ${analysisType.charAt(0).toUpperCase() + analysisType.slice(1)}...`;
            resultsDiv.innerHTML = '<p class="text-gray-500 italic">Estou gerando o relatório, vá tomar um café e me deixa em paz um segundo...</p>';
            sourcesDiv.innerHTML = '';


            try {
                const config = getAnalysisConfig(analysisType, ticker);
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

                // O payload agora usa o Google Search (grounding)
                const payload = {
                    contents: [{ parts: [{ text: config.userQuery }] }],
                    tools: [{ "google_search": {} }],
                    systemInstruction: {
                        parts: [{ text: config.systemPrompt }]
                    },
                    config: {
                         // Permite ao modelo gerar tanto texto quanto busca na web (Grounding)
                        'googleSearch': {}
                    }
                };

                const response = await fetchWithBackoff(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                const candidate = result.candidates?.[0];

                if (!candidate || !candidate.content?.parts?.[0]?.text) {
                    throw new Error("Resposta inválida da API ou conteúdo vazio.");
                }

                // Extrair o texto gerado
                let generatedText = candidate.content.parts[0].text;
                
                // 1. Processar e formatar o texto para exibição
                generatedText = formatMarkdownToHtml(generatedText);


                // 2. Extrair e exibir as fontes (citações)
                let sources = [];
                const groundingMetadata = candidate.groundingMetadata;
                if (groundingMetadata && groundingMetadata.groundingAttributions) {
                    sources = groundingMetadata.groundingAttributions
                        .map(attribution => ({
                            uri: attribution.web?.uri,
                            title: attribution.web?.title,
                        }))
                        .filter(source => source.uri && source.title);
                }

                resultsDiv.innerHTML = generatedText;
                titleElement.textContent = config.title;

                if (sources.length > 0) {
                    const uniqueSources = Array.from(new Set(sources.map(s => s.uri)))
                        .map(uri => sources.find(s => s.uri === uri));

                    const sourcesHtml = 'Fontes Consultadas: ' + uniqueSources.map((s, index) => 
                        `<a href="${s.uri}" target="_blank" class="text-indigo-600 hover:text-indigo-800 underline">${s.title} (${index + 1})</a>`
                    ).join(', ');
                    sourcesDiv.innerHTML = sourcesHtml;
                } else {
                    sourcesDiv.innerHTML = 'Nenhuma fonte citada pelo modelo (pode ter usado conhecimento geral).';
                }

                showMessage("Análise gerada com sucesso!", 'success');

            } catch (error) {
                console.error("Erro na análise:", error);
                titleElement.textContent = 'Erro na Análise';
                resultsDiv.innerHTML = `<p class="text-red-600">Ocorreu um erro ao processar sua solicitação: ${error.message}. Por favor, tente novamente.</p>`;
                sourcesDiv.innerHTML = '';
                showMessage(`Falha ao gerar análise: ${error.message}`, 'error');
            }
        }

        // Função simples para converter o formato Markdown do Gemini em HTML para melhor visualização
        function formatMarkdownToHtml(markdown) {
            let html = markdown;

            // Converter negrito (**) e (__)
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/__(.*?)__/g, '<strong>$1</strong>');

            // Converter cabeçalhos Markdown (#) para <h4> para manter o tamanho de texto razoável dentro da div de resultados
            html = html.replace(/^### (.*$)/gim, '<h4 class="text-lg font-bold mt-4 mb-2">$1</h4>');
            html = html.replace(/^## (.*$)/gim, '<h4 class="text-lg font-bold mt-4 mb-2">$1</h4>');
            html = html.replace(/^# (.*$)/gim, '<h4 class="text-xl font-bold mt-4 mb-2">$1</h4>');

            // Converter listas desordenadas (-) para <ul><li>
            html = html.replace(/^\* (.*$)/gim, '<li>$1</li>');
            html = html.replace(/^- (.*$)/gim, '<li>$1</li>');
            if (html.includes('<li>')) {
                html = '<ul class="list-disc pl-5 space-y-1">' + html + '</ul>';
                // Limpar <ul> aninhadas (não perfeito, mas resolve problemas comuns)
                html = html.replace('</ul><ul class="list-disc pl-5 space-y-1">', '');
            }

            // Converter novas linhas duplas em parágrafos
            html = '<p>' + html.split('\n\n').join('</p><p>') + '</p>';
            
            // Remover tags <p> vazias criadas pelo processamento
            html = html.replace(/<p>\s*<\/p>/g, '');
            html = html.replace(/<\/ul><\/p>/g, '</ul>');
            html = html.replace(/<p><ul/g, '<ul');

            // Adicionar quebras de linha para listas e títulos que foram convertidos
            html = html.replace(/<\/h4>(\s*)/g, '</h4>$1<br>');
            html = html.replace(/<\/li>(\s*)/g, '</li>$1');


            return html;
        }
    </script>
</body>
</html>
